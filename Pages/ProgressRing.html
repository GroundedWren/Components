<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Progress Ring Demo">
	<title>Progress Ring</title>
	
	<script src="../Scripts/ProgressRingControl.js"></script>

	<style>
		main {
			max-width: 1100px;
			margin-block: 10px;
			margin-inline: auto;

			svg {
				max-width: 80px;
			}
		}
	</style>
	<script>
		function onFormSubmit(event) {
			event.preventDefault();
			const data = new FormData(event.target);
			document.getElementById("gprOne").setAttribute("numerator", data.get("one"));
			document.getElementById("gprTwo").setAttribute("numerator", data.get("two"));
		};
	</script>
</head>
<body>
	<main>
		<button>Hi</button>
		<div>
			<gw-progress-ring id="gprOne"
				numerator="20"
				denominator="100"
				name="How far you are"
				forceAnimate
			></gw-progress-ring>
		</div>
		<div style="--animation-duration: 5s; --ring-color: red;">
			<gw-progress-ring id="gprTwo"
				name="Stuff you've done"
				denominator="100"
				percent
				progressbar
			></gw-progress-ring>
		</div>
		<form onsubmit="onFormSubmit(event)">
			<label>One:<input type="number" name="one"></label>
			<label>Two:<input type="number" name="two"></label>
			<button>Submit</button>
		</form>
	</main>
</body>
</html>
