<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Dynamic Textarea Test">
	<title>Dynamic Textarea</title>
	
	<script src="../Scripts/DynamicTextareaControl.js"></script>

	<script src="../../../Prism/prism.js" data-manual></script>
</head>
<body>
	<header>
		<a class="hide-until-focus full" href="#main">Skip to content</a>
		<h1>Dynamic Textarea</h1>
	</header>
	<main id="main">
		<label style="display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;">
			Txa Label
			<gw-dynamic-textarea data-language="css">
				<textarea id="testTxa" rows="5" cols="33"></textarea>
			</gw-dynamic-textarea>
		</label>
		<label style="display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;">
			Txa Label 2
			<gw-dynamic-textarea data-language="js">
				<textarea id="testTxa2" rows="5" cols="33"></textarea>
			</gw-dynamic-textarea>
		</label>
		<br>
		<gw-dynamic-textarea>
			<textarea id="testTxa2" rows="5" cols="33"></textarea>
		</gw-dynamic-textarea>
	</main>
</body>
</html>
