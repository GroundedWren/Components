<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Option Listbox Test">
	<title>Option Listbox Test</title>
	
	<script src="../Scripts/OptionListboxControl.js"></script>
	<style>
		h1 {
			text-align: center;
		}
		main {
			max-width: 1100px;
			margin-inline: auto;
		}
	</style>
</head>
<body>
	<header>
		<a class="hide-until-focus full" href="#main">Skip to content</a>
		<h1>Option Listbox Test</h1>
	</header>
	<main id="main">
		<gw-option-listbox>
			<fieldset>
				<legend>Fruit</legend>
				<label><input type="radio" name="fruit">Apple</label>
				<label><input type="radio" name="fruit">Apricot</label>
				<label><input type="radio" name="fruit">Banana</label>
				<label><input type="radio" name="fruit">Cherry</label>
				<label><input type="radio" name="fruit">Durian</label>
				<label><input type="radio" name="fruit">Pear</label>
			</fieldset>
		</gw-option-listbox>
	</main>
</body>
</html>
